<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Tracker</title>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e6e6e4;
      --text-main: #37352f;
      --text-sub: #787774;
      --text-light: #9b9a97;
      --primary-accent: #37352f;
      --primary-light: #f2f2f0;
      --selected-blue: #f2f2f0;
      --selected-blue-dark: #37352f;
      --sun-red: #eb5757;
      --sat-blue: #2f80ed;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-style: normal !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      user-select: none;
    }

    .tracker-card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .header h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .icon-btn {
      background: #fbfbf9;
      border: 1px solid var(--card-border);
      border-radius: 5px;
      width: 22px;
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: #f2f2f0;
      color: var(--text-main);
      border-color: #d3d3d0;
    }

    .icon-btn.active {
      background: #37352f;
      border-color: #37352f;
      color: #ffffff;
    }

    .main-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-action {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 6px;
      background: #fbfbf9;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-action:hover {
      background: #f2f2f0;
      border-color: #d3d3d0;
    }

    .btn-action:active {
      transform: scale(0.98);
      background: #e6e6e4;
    }

    .btn-main-text {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
      color: #37352f;
    }

    .btn-sub-text {
      font-size: 9.5px;
      font-weight: 500;
      color: var(--text-light);
    }

    /* 수면 시간 요약 카드 */
    .summary-box {
      background: #fbfbf9;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 44px;
    }

    .summary-box:hover {
      background: #f2f2f0;
      border-color: #d3d3d0;
    }

    .summary-label { font-size: 10px; font-weight: 600; color: var(--text-sub); }
    .summary-value { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .summary-sub { font-size: 9.5px; color: var(--text-sub); font-weight: 600; }

    /* 커스텀 모달 */
    .edit-modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
      z-index: 20;
      overflow-y: auto;
      border-radius: 12px;
    }

    .edit-modal-overlay.active { display: flex; }

    .modal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 기상 / 취침 탭 스위처 */
    .time-tab-group {
      display: flex;
      background: #f2f2f0;
      padding: 2px;
      border-radius: 6px;
      gap: 2px;
    }

    .time-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .time-tab.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* 커스텀 달력 UI */
    .calendar-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .cal-title {
      font-size: 11px;
      font-weight: 700;
      color: #37352f;
      letter-spacing: -0.2px;
    }

    .cal-nav-btn {
      background: transparent;
      border: none;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .cal-nav-btn:hover { background: #f2f2f0; color: var(--text-main); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      row-gap: 1px;
    }

    .cal-day-head {
      font-size: 8.5px;
      font-weight: 600;
      padding-bottom: 2px;
      color: var(--text-sub);
    }

    .cal-day-head.sun { color: var(--sun-red); }
    .cal-day-head.sat { color: var(--sat-blue); }

    .cal-date-cell {
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 9px;
      font-weight: 600;
      color: #37352f;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .cal-date-cell.sun { color: var(--sun-red); }
    .cal-date-cell.sat { color: var(--sat-blue); }
    .cal-date-cell.muted { opacity: 0.25; }

    .cal-date-cell.selected .date-number {
      background: #37352f;
      color: #ffffff;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      position: relative;
    }

    /* 직접 입력형 시간 피커 */
    .time-picker-card {
      background: #fbfbf9;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .time-picker-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .time-controls {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .ampm-toggle {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .time-input {
      width: 28px;
      text-align: center;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 5px;
      padding: 2px 1px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }

    .time-input:focus {
      border-color: #37352f;
      background: #ffffff;
    }

    /* 하단 버튼 */
    .modal-actions {
      display: flex;
      gap: 4px;
      margin-top: auto;
    }

    .btn-save-modal {
      flex: 1;
      background: #37352f;
      color: #ffffff;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-save-modal:hover { background: #555550; }

    .btn-cancel-modal {
      background: #f2f2f0;
      color: var(--text-sub);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel-modal:hover { background: #e6e6e4; color: var(--text-main); }

    .chart-section {
      display: none;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      animation: fadeIn 0.25s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chart-header { display: flex; justify-content: flex-end; align-items: center; }
    .toggle-group { display: flex; background: #f2f2f0; padding: 2px; border-radius: 5px; gap: 2px; }
    .toggle-btn { border: none; background: transparent; padding: 2px 6px; font-size: 9.5px; font-weight: 700; color: var(--text-sub); border-radius: 3px; cursor: pointer; }
    .toggle-btn.active { background: #ffffff; color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .chart-container { position: relative; width: 100%; height: 120px; }
  </style>
</head>
<body>

<div class="tracker-card">

  <!-- 수정 모달 -->
  <div class="edit-modal-overlay" id="editModal">
    <div class="modal-nav">
      <div class="modal-title">수면 기록 수정/설정</div>
      <button class="btn-cancel-modal" style="padding:2px 5px; font-size:9.5px;" onclick="closeEditModal()">✕</button>
    </div>

    <!-- 기상 / 취침 탭 -->
    <div class="time-tab-group">
      <button class="time-tab active" id="tabWake" onclick="switchEditTab('wake')">☀️ 기상</button>
      <button class="time-tab" id="tabBed" onclick="switchEditTab('bed')">🌙 취침</button>
    </div>

    <!-- 달력 -->
    <div class="calendar-card">
      <div class="calendar-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&lt;</button>
        <div class="cal-title" id="calTitle">2026.09</div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&gt;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- 직접 입력 시간 피커 -->
    <div class="time-picker-card">
      <div class="time-picker-label" id="pickerLabel">☀️ 기상 시간</div>
      <div class="time-controls">
        <button class="ampm-toggle" id="ampmBtn" onclick="toggleAmPm()">오전</button>
        <input type="text" id="hourInput" class="time-input" maxlength="2" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onblur="formatInputPad(this, 12, 1, 12)">
        <span style="font-weight:700; color:var(--text-sub); font-size: 9px;">:</span>
        <input type="text" id="minInput" class="time-input" maxlength="2" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onblur="formatInputPad(this, 0, 0, 59)">
      </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="modal-actions">
      <button class="btn-cancel-modal" onclick="closeEditModal()">취소</button>
      <button class="btn-save-modal" onclick="saveManualEdit()">저장하기</button>
    </div>
  </div>

  <!-- 메인 헤더 -->
  <div class="header">
    <h2>Sleep Tracker</h2>
    <button class="icon-btn" id="graphToggleBtn" onclick="toggleGraphView()" title="그래프 보기">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </button>
  </div>

  <!-- 메인 컨트롤 영역 -->
  <div class="main-controls" id="mainControls">
    <div class="action-grid">
      <button class="btn-action btn-wake" id="btnWake" onclick="handleWakeClick()">
        <span class="btn-main-text">☀️ 기상</span>
        <span class="btn-sub-text" id="waketimeSub">(-)</span>
      </button>
      <button class="btn-action btn-sleep" id="btnSleep" onclick="handleSleepClick()">
        <span class="btn-main-text">🌙 취침</span>
        <span class="btn-sub-text" id="bedtimeSub">(-)</span>
      </button>
    </div>

    <div class="summary-box" onclick="openEditModal()">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div>
          <div class="summary-label">수면시간</div>
          <div class="summary-value" id="durationDisplay">0H</div>
        </div>
        <div style="text-align: right;">
          <div class="summary-sub" id="timeRangeDisplay">기록 없음</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 그래프 영역 -->
  <div class="chart-section" id="chartSection">
    <div class="chart-header">
      <div class="toggle-group">
        <button class="toggle-btn active" id="btnWeekly" onclick="switchChartView('weekly')">주별</button>
        <button class="toggle-btn" id="btnMonthly" onclick="switchChartView('monthly')">월별</button>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="sleepChart"></canvas>
    </div>
  </div>
</div>

<script>
  let isSleeping = false;
  let currentBedtime = null;
  let chartView = 'weekly';
  let isGraphVisible = false;
  let sleepChartObj = null;

  // 모달 내부 수정 전용 상태
  let activeTab = 'wake';
  let editBedDate = new Date();
  let editWakeDate = new Date();
  let editingOriginalDate = null;
  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();

  const STORAGE_KEY_STATE = 'clean_cal_sleep_state';
  const STORAGE_KEY_LOGS = 'clean_cal_sleep_logs';

  window.addEventListener('DOMContentLoaded', () => {
    loadState();
    renderUI();
  });

  function formatTimeString(dateObj) {
    if (!dateObj) return '';
    const hours = String(dateObj.getHours()).padStart(2, '0');
    const mins = String(dateObj.getMinutes()).padStart(2, '0');
    return `${hours}:${mins}`;
  }

  function formatDateString(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatShortDate(dateObj) {
    const m = dateObj.getMonth() + 1;
    const d = dateObj.getDate();
    return `${m}/${d}`;
  }

  function formatDurationText(diffMins) {
    const hours = Math.floor(diffMins / 60);
    const mins = diffMins % 60;
    if (mins === 0) return `${hours}H`;
    return `${hours}H ${mins}M`;
  }

  function loadState() {
    const savedState = localStorage.getItem(STORAGE_KEY_STATE);
    if (savedState) {
      const parsed = JSON.parse(savedState);
      isSleeping = parsed.isSleeping;
      currentBedtime = parsed.currentBedtime ? new Date(parsed.currentBedtime) : null;
    } else {
      isSleeping = false;
      currentBedtime = null;
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify({
      isSleeping,
      currentBedtime: currentBedtime ? currentBedtime.toISOString() : null
    }));
  }

  function getLogs() {
    const saved = localStorage.getItem(STORAGE_KEY_LOGS);
    return saved ? JSON.parse(saved) : [];
  }

  function saveLogs(logs) {
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
  }

  function saveLogEntry(newLog, oldLogDate = null) {
    let logs = getLogs();

    logs = logs.filter(l => {
      if (oldLogDate && l.date === oldLogDate) return false;
      if (l.date === newLog.date) return false;
      return true;
    });

    logs.unshift(newLog);
    logs.sort((a, b) => new Date(b.date) - new Date(a.date));
    saveLogs(logs);
  }

  function handleSleepClick() {
    currentBedtime = new Date();
    isSleeping = true;
    saveState();
    renderUI();
  }

  async function handleWakeClick() {
    if (!currentBedtime) {
      currentBedtime = new Date(Date.now() - 8 * 60 * 60 * 1000);
    }

    const wakeTime = new Date();
    const logEntry = calculateLogEntry(currentBedtime, wakeTime);

    saveLogEntry(logEntry);

    isSleeping = false;
    currentBedtime = null;
    saveState();

    renderUI();
    if (isGraphVisible) updateChart();

    await sendToNotion(logEntry);
  }

  function calculateLogEntry(bedTimeObj, wakeTimeObj) {
    let diffMs = wakeTimeObj - bedTimeObj;
    if (diffMs < 0) diffMs = 0;

    const diffMins = Math.floor(diffMs / (1000 * 60));
    const durationStr = formatDurationText(diffMins);
    const decimalHours = parseFloat((diffMins / 60).toFixed(1));

    return {
      id: 'sleep_' + formatDateString(wakeTimeObj),
      date: formatDateString(wakeTimeObj),
      bedtime: bedTimeObj.toISOString(),
      waketime: wakeTimeObj.toISOString(),
      bedDateStr: formatDateString(bedTimeObj),
      wakeDateStr: formatDateString(wakeTimeObj),
      bedtimeStr: formatTimeString(bedTimeObj),
      waketimeStr: formatTimeString(wakeTimeObj),
      durationStr: durationStr,
      durationHours: decimalHours
    };
  }

  function openEditModal() {
    const logs = getLogs();
    const now = new Date();

    if (logs.length > 0) {
      const latest = logs[0];
      editBedDate = new Date(latest.bedtime);
      editWakeDate = new Date(latest.waketime);
      editingOriginalDate = latest.date;
    } else {
      editBedDate = new Date(now.getTime() - 8 * 60 * 60 * 1000);
      editWakeDate = new Date(now);
      editingOriginalDate = null;
    }

    switchEditTab('wake');
    document.getElementById('editModal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
  }

  function switchEditTab(tab) {
    activeTab = tab;
    document.getElementById('tabWake').classList.toggle('active', tab === 'wake');
    document.getElementById('tabBed').classList.toggle('active', tab === 'bed');
    document.getElementById('pickerLabel').innerText = tab === 'wake' ? '☀️ 기상 시간' : '🌙 취침 시간';

    const targetDate = tab === 'wake' ? editWakeDate : editBedDate;
    viewYear = targetDate.getFullYear();
    viewMonth = targetDate.getMonth();

    renderCalendar();
    syncTimePickerUI();
  }

  function changeMonth(delta) {
    viewMonth += delta;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    else if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    const titleEl = document.getElementById('calTitle');
    const mStr = String(viewMonth + 1).padStart(2, '0');
    titleEl.innerText = `${viewYear}.${mStr}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = `
      <div class="cal-day-head sun">일</div>
      <div class="cal-day-head">월</div>
      <div class="cal-day-head">화</div>
      <div class="cal-day-head">수</div>
      <div class="cal-day-head">목</div>
      <div class="cal-day-head">금</div>
      <div class="cal-day-head sat">토</div>
    `;

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

    const targetDateObj = activeTab === 'wake' ? editWakeDate : editBedDate;

    for (let i = firstDay - 1; i >= 0; i--) {
      grid.innerHTML += `<div class="cal-date-cell muted"><span class="date-number">${prevLastDate - i}</span></div>`;
    }

    for (let d = 1; d <= lastDate; d++) {
      const curDate = new Date(viewYear, viewMonth, d);
      const dayOfWeek = curDate.getDay();

      let classNames = ['cal-date-cell'];
      if (dayOfWeek === 0) classNames.push('sun');
      if (dayOfWeek === 6) classNames.push('sat');

      const isSelected = targetDateObj.getFullYear() === viewYear &&
                         targetDateObj.getMonth() === viewMonth &&
                         targetDateObj.getDate() === d;

      if (isSelected) classNames.push('selected');

      grid.innerHTML += `
        <div class="${classNames.join(' ')}" onclick="selectCalDate(${d})">
          <span class="date-number">${d}</span>
        </div>
      `;
    }
  }

  function selectCalDate(day) {
    const target = activeTab === 'wake' ? editWakeDate : editBedDate;
    target.setFullYear(viewYear);
    target.setMonth(viewMonth);
    target.setDate(day);
    renderCalendar();
  }

  function syncTimePickerUI() {
    const target = activeTab === 'wake' ? editWakeDate : editBedDate;
    let hours = target.getHours();
    const mins = target.getMinutes();

    const isPm = hours >= 12;
    document.getElementById('ampmBtn').innerText = isPm ? '오후' : '오전';

    hours = hours % 12;
    if (hours === 0) hours = 12;

    document.getElementById('hourInput').value = String(hours).padStart(2, '0');
    document.getElementById('minInput').value = String(mins).padStart(2, '0');
  }

  function formatInputPad(el, defaultVal, minVal, maxVal) {
    let val = parseInt(el.value, 10);
    if (isNaN(val)) val = defaultVal;
    if (val < minVal) val = minVal;
    if (val > maxVal) val = maxVal;
    el.value = String(val).padStart(2, '0');
    updateTimeFromControls();
  }

  function toggleAmPm() {
    const btn = document.getElementById('ampmBtn');
    btn.innerText = btn.innerText === '오전' ? '오후' : '오전';
    updateTimeFromControls();
  }

  function updateTimeFromControls() {
    const target = activeTab === 'wake' ? editWakeDate : editBedDate;
    const isPm = document.getElementById('ampmBtn').innerText === '오후';
    
    let hour = parseInt(document.getElementById('hourInput').value, 10);
    let min = parseInt(document.getElementById('minInput').value, 10);

    if (isNaN(hour) || hour < 1) hour = 12;
    if (hour > 12) hour = 12;
    if (isNaN(min) || min < 0) min = 0;
    if (min > 59) min = 59;

    if (isPm && hour < 12) hour += 12;
    if (!isPm && hour === 12) hour = 0;

    target.setHours(hour);
    target.setMinutes(min);
  }

  async function saveManualEdit() {
    updateTimeFromControls();

    if (editWakeDate < editBedDate) {
      alert('기상 시각이 취침 시각보다 빠를 수 없습니다. 날짜 및 시간을 확인해주세요.');
      return;
    }

    const updatedLog = calculateLogEntry(editBedDate, editWakeDate);
    
    saveLogEntry(updatedLog, editingOriginalDate);

    if (isGraphVisible) updateChart();
    
    try {
      await sendToNotion(updatedLog);
    } catch (e) {
      console.warn('노션 자동 전송 스킵:', e);
    }

    closeEditModal();
    renderUI();
  }

  async function sendToNotion(log) {
    try {
      const payload = {
        title: `수면 ${log.durationStr}`,
        Title: `수면 ${log.durationStr}`,
        date: log.date || log.wakeDateStr,
        Date: log.date || log.wakeDateStr,
        bedtime: log.bedtime,
        waketime: log.waketime,
        bedtimeStr: log.bedtimeStr,
        waketimeStr: log.waketimeStr,
        durationStr: log.durationStr,
        durationHours: log.durationHours,
        summary: `수면: ${log.bedtimeStr} ~ ${log.waketimeStr} (${log.durationStr})`
      };

      await fetch('/api/notion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (e) {
      console.warn('노션 API 전송 실패:', e);
    }
  }

  function renderUI() {
    const bedtimeSub = document.getElementById('bedtimeSub');
    const waketimeSub = document.getElementById('waketimeSub');
    const durationDisplay = document.getElementById('durationDisplay');
    const timeRangeDisplay = document.getElementById('timeRangeDisplay');

    const logs = getLogs();
    const latest = logs.length > 0 ? logs[0] : null;

    if (isSleeping) {
      bedtimeSub.innerText = currentBedtime ? `(${formatTimeString(currentBedtime)})` : '(-)';
      waketimeSub.innerText = '(-)';
    } else {
      waketimeSub.innerText = latest ? `(${latest.waketimeStr})` : '(-)';
      bedtimeSub.innerText = '(-)';
    }

    durationDisplay.innerText = latest ? latest.durationStr : '0H';
    
    if (latest) {
      const bedObj = new Date(latest.bedtime);
      const wakeObj = new Date(latest.waketime);
      const isSameDay = formatDateString(bedObj) === formatDateString(wakeObj);

      if (isSameDay) {
        timeRangeDisplay.innerText = `${formatShortDate(wakeObj)} (${latest.bedtimeStr} ~ ${latest.waketimeStr})`;
      } else {
        timeRangeDisplay.innerText = `${formatShortDate(bedObj)} ${latest.bedtimeStr} ~ ${formatShortDate(wakeObj)} ${latest.waketimeStr}`;
      }
    } else {
      timeRangeDisplay.innerText = '기록 없음';
    }
  }

  function toggleGraphView() {
    const section = document.getElementById('chartSection');
    const mainControls = document.getElementById('mainControls');
    const toggleBtn = document.getElementById('graphToggleBtn');

    isGraphVisible = !isGraphVisible;
    if (isGraphVisible) {
      mainControls.style.display = 'none';
      section.style.display = 'flex';
      toggleBtn.classList.add('active');
      if (!sleepChartObj) initChart();
      else updateChart();
    } else {
      section.style.display = 'none';
      mainControls.style.display = 'flex';
      toggleBtn.classList.remove('active');
    }
  }

  function switchChartView(view) {
    chartView = view;
    document.getElementById('btnWeekly').classList.toggle('active', view === 'weekly');
    document.getElementById('btnMonthly').classList.toggle('active', view === 'monthly');
    updateChart();
  }

  function initChart() {
    const ctx = document.getElementById('sleepChart').getContext('2d');
    sleepChartObj = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => chartView === 'weekly' ? `수면: ${ctx.parsed.y}시간` : `월평균: ${ctx.parsed.y}시간`
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { family: 'Pretendard', size: 10, weight: '600' }, color: '#37352f' }
          },
          y: {
            beginAtZero: true,
            max: 12,
            grid: { color: '#f2f2f0' },
            ticks: { font: { family: 'Pretendard', size: 9 }, color: '#9b9a97', stepSize: 3 }
          }
        }
      }
    });
    updateChart();
  }

  function updateChart() {
    if (!sleepChartObj) return;

    const logs = getLogs();
    const labels = [];
    const dataValues = [];

    if (chartView === 'weekly') {
      const now = new Date();
      const currentDay = now.getDay();
      const distToMon = (currentDay === 0 ? -6 : 1 - currentDay);
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + distToMon);

      const dayLabels = ['월', '화', '수', '목', '금', '토', '일'];

      const logMap = {};
      logs.forEach(l => {
        logMap[l.date] = l.durationHours;
      });

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = formatDateString(d);

        labels.push(dayLabels[i]);
        dataValues.push(logMap[dateStr] || 0);
      }
    } else {
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const targetMonthDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const year = targetMonthDate.getFullYear();
        const month = targetMonthDate.getMonth() + 1;
        const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

        const monthLogs = logs.filter(l => l.date.startsWith(monthPrefix));
        let avgHours = 0;
        if (monthLogs.length > 0) {
          const totalHours = monthLogs.reduce((acc, cur) => acc + cur.durationHours, 0);
          avgHours = parseFloat((totalHours / monthLogs.length).toFixed(1));
        }

        labels.push(`${month}월`);
        dataValues.push(avgHours);
      }
    }

    sleepChartObj.data = {
      labels: labels,
      datasets: [{
        data: dataValues,
        backgroundColor: chartView === 'weekly' ? '#37352f' : '#787774',
        hoverBackgroundColor: '#000000',
        borderRadius: 4,
        borderSkipped: false
      }]
    };
    sleepChartObj.update();
  }
</script>
